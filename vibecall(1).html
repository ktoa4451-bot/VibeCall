<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCall — звонок</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#07080d; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.09);
    --txt:#f2f4fa; --mut:#8b90a3;
    --grad:linear-gradient(120deg,#6c5ce7,#00d2ff);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif}
  body{background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
  button{font-family:inherit}

  .glow{position:fixed;border-radius:50%;filter:blur(110px);opacity:.22;pointer-events:none;animation:fl 16s ease-in-out infinite alternate;z-index:0}
  .g1{width:480px;height:480px;background:#5b3df0;top:-140px;left:-100px}
  .g2{width:420px;height:420px;background:#00b7ff;bottom:-120px;right:-90px;animation-delay:-8s}
  @keyframes fl{to{transform:translate(50px,-30px) scale(1.1)}}

  .screen{position:fixed;inset:0;z-index:2;display:none}
  .screen.on{display:flex}

  /* ===== ГЛАВНЫЙ ЭКРАН ===== */
  #home{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .logo{display:flex;align-items:center;gap:13px;font-size:30px;font-weight:800;margin-bottom:14px}
  .logo .dot{width:52px;height:52px;border-radius:16px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 34px rgba(108,92,231,.55)}
  .logo svg{width:26px;height:26px}
  h1{font-size:clamp(30px,4.4vw,50px);font-weight:800;line-height:1.1;
     background:linear-gradient(180deg,#fff 45%,#a7b0d6);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .gr{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--mut);margin:16px 0 34px;font-size:16px;max-width:520px;line-height:1.6}
  .panel{
    display:flex;flex-direction:column;gap:14px;width:min(380px,92vw);
    background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;
    backdrop-filter:blur(10px);
  }
  .panel input{
    padding:14px 17px;border-radius:14px;border:1px solid var(--line);
    background:rgba(0,0,0,.25);color:var(--txt);font-size:15.5px;outline:none;text-align:center;letter-spacing:1px;
  }
  .panel input:focus{border-color:#6c5ce7;box-shadow:0 0 0 4px rgba(108,92,231,.16)}
  .panel label{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;text-align:left}
  .bigbtn{
    padding:15px;border:none;border-radius:15px;background:var(--grad);color:#fff;
    font-size:16px;font-weight:700;cursor:pointer;transition:.25s;
    box-shadow:0 8px 28px rgba(0,150,255,.3);display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .bigbtn:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(108,92,231,.5)}
  .bigbtn:disabled{opacity:.45;cursor:wait;transform:none}
  .ghostbtn{
    padding:13px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--mut);
    font-size:14.5px;font-weight:600;cursor:pointer;transition:.2s;
  }
  .ghostbtn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  .or{display:flex;align-items:center;gap:12px;color:#4b4f63;font-size:12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  #status{font-size:13.5px;color:var(--mut);min-height:20px;margin-top:4px}
  #status.err{color:#ff7d92}
  #status.ok{color:#7cf7d4}
  .hint{margin-top:18px;font-size:12.5px;color:#4b4f63;display:flex;align-items:center;gap:8px}
  .hint i{width:7px;height:7px;border-radius:50%;background:#7cf7d4;animation:pl 1.8s infinite}
  @keyframes pl{70%{box-shadow:0 0 0 8px rgba(124,247,212,0)}100%{box-shadow:0 0 0 0 rgba(124,247,212,0)}}

  /* ===== ЗВОНОК ===== */
  #call{flex-direction:column}
  .stage{flex:1;position:relative;display:grid;place-items:center;padding:20px;z-index:2}
  .remote-wrap{position:relative;width:min(1100px,100%);height:100%;display:grid;place-items:center}
  video{width:100%;height:100%;object-fit:cover;background:#000}
  #remoteVideo{
    position:absolute;inset:0;border-radius:24px;border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .remote-off{
    position:absolute;inset:0;border-radius:24px;border:1px solid var(--line);
    display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
    background:radial-gradient(110% 130% at 30% 15%,#241d4d 0%,#0c0e17 68%);
  }
  .remote-off svg{width:96px;height:96px;filter:drop-shadow(0 0 26px rgba(108,92,231,.7))}
  .remote-off p{color:var(--mut);font-size:14.5px}
  #selfBox{
    position:absolute;right:22px;bottom:22px;width:min(240px,34%);aspect-ratio:16/10;
    border-radius:16px;overflow:hidden;border:1px solid var(--line);z-index:3;
    box-shadow:0 16px 40px rgba(0,0,0,.55);background:#0d0f18;
  }
  #selfBox .self-off{position:absolute;inset:0;display:grid;place-items:center}
  #selfBox .self-off svg{width:42px;height:42px}
  #selfBox.cam-off video{visibility:hidden}
  .nameTag{
    position:absolute;left:10px;bottom:10px;padding:5px 11px;border-radius:9px;z-index:4;
    background:rgba(0,0,0,.6);backdrop-filter:blur(6px);font-size:12.5px;display:flex;gap:7px;align-items:center;
  }
  .nameTag i{width:7px;height:7px;border-radius:50%;background:#7cf7d4}

  .topline{
    position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;z-index:5;
    pointer-events:none;
  }
  .pill{
    padding:8px 15px;border-radius:100px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);
    border:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:center;pointer-events:auto;
  }
  .pill b{letter-spacing:1px}
  #callStatus i{width:8px;height:8px;border-radius:50%;background:#f7e37c;animation:pl 1.6s infinite}

  .dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:22px;z-index:5}
  .dwrap{display:flex;gap:13px;padding:12px 16px;border-radius:26px;background:rgba(13,15,24,.78);
    backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .dbtn{
    width:54px;height:54px;border-radius:50%;border:1px solid var(--line);cursor:pointer;
    background:rgba(255,255,255,.06);display:grid;place-items:center;transition:.22s;position:relative;
  }
  .dbtn:hover{transform:translateY(-3px);background:rgba(255,255,255,.13)}
  .dbtn svg{width:22px;height:22px;stroke:#e6e9f5}
  .dbtn.off-warn{background:rgba(255,77,103,.2);border-color:rgba(255,77,103,.55)}
  .dbtn.end{width:64px;background:linear-gradient(135deg,#ff4d67,#ff7a45);border:none}
  .dbtn.end svg{stroke:#fff}
  .dbtn .tip{
    position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
    padding:6px 11px;border-radius:9px;background:#1a1d2c;border:1px solid var(--line);
    font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;color:#cfd3e6;
  }
  .dbtn:hover .tip{opacity:1}

  @media(max-width:640px){
    #selfBox{width:120px;right:12px;bottom:96px}
    .dbtn{width:48px;height:48px}
    .dbtn.end{width:58px}
  }
</style>
</head>
<body>

<div class="glow g1"></div><div class="glow g2"></div>

<!-- ======= ГЛАВНЫЙ ЭКРАН ======= -->
<div id="home" class="screen on">
  <div class="logo">
    <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></span>
    VibeCall
  </div>
  <h1>Говорите <span class="gr">лицом к лицу</span></h1>
  <p class="sub">Настоящее видео и звук напрямую между вами. Без регистрации и установки — один клик.</p>

  <div class="panel">
    <button class="bigbtn" id="createBtn">📹 &nbsp;Создать комнату</button>
    <div class="or">или присоединиться</div>
    <label>Код комнаты</label>
    <input id="joinCode" placeholder="например, a7k2x9" maxlength="12" autocomplete="off">
    <button class="ghostbtn" id="joinBtn">Присоединиться к звонку →</button>
    <div id="status"></div>
  </div>

  <div class="hint"><i></i> Работает в Chrome, Edge, Safari · соединение шифруется E2E</div>
</div>

<!-- ======= ЗВОНОК ======= -->
<div id="call" class="screen">
  <div class="stage">
    <div class="remote-wrap">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="remote-off" id="remoteOff">
        <svg viewBox="0 0 24 24" fill="none" stroke="url(#g1)" stroke-width="1.1" stroke-linecap="round"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9aaff"/><stop offset="1" stop-color="#7cf7d4"/></linearGradient></defs><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        <p id="remoteOffText">Ожидание собеседника…</p>
      </div>
      <div class="nameTag" id="remoteTag" style="left:14px;bottom:14px;display:none"><i></i><b id="remoteName">Собеседник</b></div>

      <div id="selfBox">
        <div class="self-off"><svg viewBox="0 0 24 24" fill="none" stroke="#7cf7d4" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg></div>
        <video id="selfVideo" autoplay playsinline muted></video>
        <div class="nameTag"><i></i>Вы</div>
      </div>
    </div>

    <div class="topline">
      <div class="pill">✦ Комната <b id="roomCode">—</b></div>
      <div class="pill" id="callStatus"><i></i><span id="callStatusText">соединение…</span></div>
    </div>

    <div class="dock">
      <div class="dwrap">
        <button class="dbtn" id="btnMic"><span class="tip">Микрофон (M)</span>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg></button>
        <button class="dbtn" id="btnCam"><span class="tip">Камера (V)</span>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button>
        <button class="dbtn end" id="btnEnd"><span class="tip">Завершить</span>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 13.3a16 16 0 0 1-3.3-4.7L8.9 7.2a2 2 0 0 0 .5-2.1L6.7 2.6A2 2 0 0 0 3.4 3.5L2 8c0 7 7 14 14 14l4.5-1.4a2 2 0 0 0 .9-3.3l-2.5-2.7a2 2 0 0 0-2.1.5l-1.4 1.5a16 16 0 0 1-4.7-3.3z" transform="rotate(135 12 12)"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   НАСТОЯЩИЙ ЗВОНОК: WebRTC через облачный сигнальный сервер
   PeerJS (бесплатный брокер 0.peerjs.com). Видео/аудио идут
   напрямую P2P между браузерами.
   ========================================================= */
const $ = id => document.getElementById(id);
const home=$('home'), call=$('call'), statusEl=$('status');

let peer=null, conn=null, localStream=null, roomCode=null, micOn=true, camOn=true;

function code6(){const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function setStatus(t,cls){statusEl.textContent=t;statusEl.className=cls||'';}

async function getMedia(){
  return navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}});
}

/* ---------- создатель ---------- */
$('createBtn').onclick=async()=>{
  setStatus('Запрашиваем камеру и микрофон…');
  $('createBtn').disabled=true;
  try{ localStream=await getMedia(); }catch(e){
    setStatus('⚠️ Нет доступа к камере/микрофону. Разрешите их в браузере.','err');
    $('createBtn').disabled=false;return;
  }
  roomCode=code6();
  connectPeer(roomCode,true);
};

/* ---------- присоединяющийся ---------- */
$('joinBtn').onclick=async()=>{
  const code=$('joinCode').value.trim().toLowerCase();
  if(code.length<4){setStatus('Введите код комнаты (4+ символов)','err');return;}
  setStatus('Запрашиваем камеру и микрофон…');
  $('joinBtn').disabled=true;
  try{ localStream=await getMedia(); }catch(e){
    setStatus('⚠️ Нет доступа к камере/микрофону. Разрешите их в браузере.','err');
    $('joinBtn').disabled=false;return;
  }
  roomCode=code;
  connectPeer(null,false);
};

function connectPeer(id,isHost){
  setStatus('Подключаемся…');
  peer=new Peer(id,{debug:0});

  peer.on('open',pid=>{
    if(isHost){
      enterCall(pid);
      setStatus('✓ Комната создана! Отправьте код другу: '+pid,'ok');
      waitForCall();
    }else{
      setStatus('Звоним…');
      const p=peer.connect(roomCode);
      p.on('open',()=>{ conn=p; enterCall(roomCode); startCallTo(roomCode); });
      p.on('error',()=>{leaveToHome('Комната не найдена. Проверьте код.');});
    }
  });

  peer.on('error',err=>{
    if(err.type==='unavailable-id'){ // код занят — регенерируем
      roomCode=code6();peer.destroy();connectPeer(roomCode,true);return;
    }
    if(err.type==='peer-unavailable'){leaveToHome('Комната не найдена. Проверьте код.');return;}
    setStatus('Ошибка: '+err.type,'err');
  });
}

/* ---------- вход в интерфейс звонка ---------- */
function enterCall(code){
  home.classList.remove('on');call.classList.add('on');
  $('roomCode').textContent=code;
  $('selfVideo').srcObject=localStream;
  $('btnMic').classList.remove('off-warn');$('btnCam').classList.remove('off-warn');
  setCallStatus('ожидание собеседника…');
}
function leaveToHome(msg){
  cleanup();
  call.classList.remove('on');home.classList.add('on');
  setStatus(msg,'err');
  $('createBtn').disabled=false;$('joinBtn').disabled=false;
}
function setCallStatus(t){$('callStatusText').textContent=t;}

/* ---------- хост: ждём входящего звонка ---------- */
function waitForCall(){
  peer.on('call',incoming=>{
    incoming.answer(localStream);
    bindRemote(incoming);
    setCallStatus('входящий звонок…');
  });
  peer.on('connection',c=>{
    conn=c;
    c.on('data',d=>{if(d==='bye')hangUp(false);});
  });
}

/* ---------- гость: звоним хосту ---------- */
function startCallTo(code){
  const r=peer.call(code,localStream);
  bindRemote(r);
  peer.on('connection',()=>{});
}

/* ---------- привязка удалённого потока ---------- */
function bindRemote(r){
  if(!r)return;
  r.on('stream',remote=>{
    $('remoteVideo').srcObject=remote;
    $('remoteOff').style.display='none';
    $('remoteTag').style.display='flex';
    setCallStatus('✓ на связи');
  });
  r.on('close',()=>hangUp(false));
  r.on('error',()=>{});
}

/* ---------- отбой ---------- */
function hangUp(sayBye=true){
  if(sayBye&&conn){try{conn.send('bye');}catch(e){}}
  cleanup();
  call.classList.remove('on');home.classList.add('on');
  setStatus('Звонок завершён','ok');
  $('remoteOff').style.display='flex';
  $('remoteOffText').textContent='Ожидание собеседника…';
  $('remoteTag').style.display='none';
}
function cleanup(){
  peer?.destroy();peer=null;conn=null;
  localStream?.getTracks().forEach(t=>t.stop());localStream=null;
  $('remoteVideo').srcObject=null;$('selfVideo').srcObject=null;
  $('createBtn').disabled=false;$('joinBtn').disabled=false;
}

/* ---------- кнопки ---------- */
$('btnEnd').onclick=()=>hangUp(true);
$('btnMic').onclick=()=>{
  micOn=!micOn;localStream?.getAudioTracks().forEach(t=>t.enabled=micOn);
  $('btnMic').classList.toggle('off-warn',!micOn);
};
$('btnCam').onclick=()=>{
  camOn=!camOn;localStream?.getVideoTracks().forEach(t=>t.enabled=camOn);
  $('btnCam').classList.toggle('off-warn',!camOn);
  $('selfBox').classList.toggle('cam-off',!camOn);
};
addEventListener('keydown',e=>{
  if(!call.classList.contains('on'))return;
  const k=e.key.toLowerCase();
  if(k==='m')$('btnMic').click();
  if(k==='v')$('btnCam').click();
});
</script>
</body>
</html>
